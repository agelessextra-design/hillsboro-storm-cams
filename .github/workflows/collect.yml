name: Collect cameras, radar and road weather

# One run loops internally: every 5 minutes while a storm window is open, for about 5.5 hours,
# then starts the next run itself. The timer below and the page's Start button only wake the chain up.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Is a storm window open or about to open?
        id: gate
        run: python3 gate.py schedule.json

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Collect every 5 minutes
        if: steps.gate.outputs.go == 'true'
        run: python3 loop.py
